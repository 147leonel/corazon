<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Feliz dia de la novia</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #02030a;
      --white: #fff8f8;
      --soft-pink: #ffd0e5;
      --hot-pink: #ff2d86;
      --violet: #9a7cff;
      --cyan: #9be7ff;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--bg);
      font-family: Arial, Helvetica, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    .app,
    .universe {
      width: 100vw;
      height: 100vh;
    }

    .universe {
      position: relative;
      display: grid;
      place-items: center;
      overflow: hidden;
      perspective: 950px;
      cursor: grab;
      user-select: none;
      touch-action: none;
      background:
        radial-gradient(circle at 22% 18%, rgba(154, 124, 255, 0.22), transparent 28%),
        radial-gradient(circle at 78% 70%, rgba(255, 45, 134, 0.17), transparent 26%),
        radial-gradient(circle at center, #07091b 0%, #02030a 58%, #000 100%);
    }

    .universe:active {
      cursor: grabbing;
    }

    .starfield,
    .starfield span {
      position: absolute;
      pointer-events: none;
    }

    .starfield {
      top: 0;
      right: 0;
      bottom: 0;
      left: 0;
      inset: 0;
      z-index: 1;
      overflow: hidden;
    }

    .starfield span {
      border-radius: 50%;
      animation: backgroundTwinkle 4s ease-in-out infinite;
    }

    .header-text,
    .love-counter {
      position: fixed;
      left: 50%;
      z-index: 20;
      width: min(92vw, 720px);
      transform: translateX(-50%);
      color: var(--white);
      text-align: center;
      letter-spacing: 0;
      pointer-events: none;
      text-shadow:
        0 0 14px rgba(255, 208, 229, 0.95),
        0 0 34px rgba(255, 45, 134, 0.64),
        0 0 58px rgba(154, 124, 255, 0.34);
    }

    .header-text {
      top: 22px;
      display: grid;
      gap: 4px;
    }

    .title-text {
      font-size: clamp(1.55rem, 6.6vw, 3.45rem);
      font-weight: 900;
    }

    .subtitle-text {
      color: var(--soft-pink);
      font-size: clamp(1.05rem, 4.8vw, 2.15rem);
      font-weight: 800;
    }

    .love-counter {
      bottom: 18px;
      display: grid;
      gap: 7px;
      max-width: min(90vw, 430px);
      padding: 10px 14px;
      border: 1px solid rgba(255, 208, 229, 0.25);
      border-radius: 16px;
      background: rgba(2, 3, 10, 0.56);
      box-shadow:
        0 0 24px rgba(255, 45, 134, 0.2),
        inset 0 0 18px rgba(255, 255, 255, 0.05);
    }

    .counter-label {
      color: var(--soft-pink);
      font-size: clamp(0.78rem, 2.6vw, 0.98rem);
      font-weight: 900;
    }

    .counter-values {
      display: flex;
      justify-content: center;
      gap: clamp(10px, 3vw, 18px);
    }

    .counter-item {
      display: grid;
      gap: 2px;
      min-width: 60px;
    }

    .counter-number {
      font-size: clamp(1rem, 4.1vw, 1.35rem);
      font-weight: 900;
      line-height: 1;
    }

    .counter-unit {
      color: rgba(255, 248, 248, 0.74);
      font-size: clamp(0.6rem, 2.2vw, 0.76rem);
      font-weight: 700;
    }

    .scene {
      position: relative;
      z-index: 5;
      width: min(82vmin, 660px);
      height: min(82vmin, 660px);
      transform-style: preserve-3d;
    }

    .galaxy {
      position: absolute;
      inset: 0;
      transform-style: preserve-3d;
      animation: idleFloat 9s ease-in-out infinite;
      will-change: transform;
    }

    .fallback-heart {
      position: absolute;
      top: 50%;
      left: 50%;
      z-index: 3;
      width: 180px;
      height: 180px;
      margin: -90px 0 0 -90px;
      color: rgba(255, 45, 134, 0.78);
      font-size: 150px;
      line-height: 180px;
      text-align: center;
      text-shadow:
        0 0 24px rgba(255, 45, 134, 0.9),
        0 0 64px rgba(255, 208, 229, 0.5);
      transform: scale(1);
      transform-origin: center;
      background: transparent;
      box-shadow:
        0 0 80px rgba(255, 45, 134, 0.18);
      animation: fallbackBeat 1.8s ease-in-out infinite;
    }

    .fallback-heart.hidden-fallback {
      display: none;
    }

    .star-point,
    .word-star {
      position: absolute;
      top: 50%;
      left: 50%;
      transform-style: preserve-3d;
      will-change: transform;
    }

    .star-point {
      width: var(--size);
      height: var(--size);
      margin-left: calc(var(--size) / -2);
      margin-top: calc(var(--size) / -2);
      border-radius: 50%;
      background: var(--color);
      box-shadow:
        0 0 8px var(--color),
        0 0 14px rgba(255, 45, 134, 0.54);
      animation: pulse var(--duration) ease-in-out infinite;
    }

    .heart-star {
      box-shadow:
        0 0 10px var(--color),
        0 0 18px rgba(255, 45, 134, 0.72),
        0 0 30px rgba(255, 143, 195, 0.34);
    }

    .word-star {
      display: flex;
      align-items: center;
      gap: 7px;
      color: var(--soft-pink);
      font-size: clamp(0.72rem, 1.9vmin, 1rem);
      font-weight: 700;
      line-height: 1;
      text-shadow:
        0 0 8px rgba(255, 208, 229, 0.95),
        0 0 18px rgba(255, 45, 134, 0.62);
      white-space: nowrap;
      animation: wordGlow var(--duration) ease-in-out infinite;
    }

    .word-star::before {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      content: "";
      background: #fff;
      box-shadow:
        0 0 8px #fff,
        0 0 17px var(--cyan),
        0 0 25px var(--soft-pink);
      flex: 0 0 auto;
    }

    @keyframes backgroundTwinkle {
      0%,
      100% {
        opacity: 0.42;
        transform: scale(0.86);
      }
      50% {
        opacity: var(--opacity);
        transform: scale(1.14);
      }
    }

    @keyframes fallbackBeat {
      0%,
      100% {
        transform: scale(0.96);
      }
      50% {
        transform: scale(1.05);
      }
    }

    @keyframes idleFloat {
      0%,
      100% {
        translate: 0 0;
      }
      50% {
        translate: 0 -10px;
      }
    }

    @keyframes pulse {
      0%,
      100% {
        opacity: 0.82;
        scale: 0.92;
      }
      50% {
        opacity: 1;
        scale: 1.08;
      }
    }

    @keyframes wordGlow {
      0%,
      100% {
        opacity: 0.86;
      }
      50% {
        opacity: 1;
      }
    }

    @media (max-width: 620px) {
      .scene {
        width: 82vmin;
        height: 82vmin;
      }

      .word-star {
        font-size: clamp(0.62rem, 2.7vmin, 0.82rem);
      }

      .love-counter {
        bottom: 10px;
        padding: 9px 10px;
      }
    }
  </style>
</head>
<body>
  <main class="app" aria-label="Universo de amor">
    <section class="universe" id="universe" aria-label="Universo interactivo">
      <div class="starfield" id="starfield" aria-hidden="true"></div>
      <div class="header-text">
        <div class="title-text">Feliz dia de la novia</div>
        <div class="subtitle-text">Mi universo</div>
      </div>
      <div class="scene">
        <div class="fallback-heart" id="fallbackHeart" aria-hidden="true">♥</div>
        <div class="galaxy" id="galaxy" aria-hidden="true"></div>
      </div>
      <div class="love-counter" aria-live="polite">
        <div class="counter-label">juntos</div>
        <div class="counter-values">
          <div class="counter-item">
            <span class="counter-number" id="daysValue">0</span>
            <span class="counter-unit">dias</span>
          </div>
          <div class="counter-item">
            <span class="counter-number" id="minutesValue">0</span>
            <span class="counter-unit">minutos</span>
          </div>
          <div class="counter-item">
            <span class="counter-number" id="secondsValue">00</span>
            <span class="counter-unit">segundos</span>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script>
    const universe = document.getElementById("universe");
    const starfield = document.getElementById("starfield");
    const galaxy = document.getElementById("galaxy");
    const fallbackHeart = document.getElementById("fallbackHeart");
    const daysValue = document.getElementById("daysValue");
    const minutesValue = document.getElementById("minutesValue");
    const secondsValue = document.getElementById("secondsValue");
    const togetherStart = new Date(2026, 5, 11, 0, 0, 0);

    const phrases = [
      "te quiero",
      "preciosa",
      "mi niña",
      "mi amor",
      "hermosa",
      "eres mi cielo",
      "mi vida",
      "bonita",
      "mi estrella",
      "mi reina",
      "contigo todo",
      "mi alegria",
      "te adoro",
      "mi universo",
      "mi princesa",
      "siempre tu",
      "luz de mi vida",
      "mi corazon",
    ];

    let rotationX = -12;
    let rotationY = 18;
    let targetX = rotationX;
    let targetY = rotationY;
    let isDragging = false;
    let lastPointerX = 0;
    let lastPointerY = 0;

    function randomBetween(min, max) {
      return Math.random() * (max - min) + min;
    }

    function createRandomStarfield() {
      const total = 190;
      const colors = ["#ffffff", "#ffd0e5", "#9be7ff", "#d8ccff"];

      for (let i = 0; i < total; i += 1) {
        const star = document.createElement("span");
        const size = randomBetween(1, Math.random() > 0.88 ? 3.4 : 2.1);
        const color = colors[Math.floor(randomBetween(0, colors.length))];

        star.style.left = `${randomBetween(0, 100)}vw`;
        star.style.top = `${randomBetween(0, 100)}vh`;
        star.style.width = `${size}px`;
        star.style.height = `${size}px`;
        star.style.opacity = `${randomBetween(0.32, 0.95)}`;
        star.style.background = color;
        star.style.boxShadow = `0 0 ${randomBetween(6, 18)}px ${color}`;
        star.style.animationDuration = `${randomBetween(2.2, 7.5)}s`;
        star.style.setProperty("--opacity", `${randomBetween(0.32, 0.95)}`);
        star.style.animationDelay = `${randomBetween(-7, 0)}s`;

        starfield.appendChild(star);
      }
    }

    function createHeartStars() {
      const layers = [
        { scale: 7.15, z: -58, shrink: 0.86, count: 92 },
        { scale: 7.65, z: -34, shrink: 0.93, count: 104 },
        { scale: 8.05, z: -12, shrink: 0.99, count: 116 },
        { scale: 8.2, z: 12, shrink: 1.03, count: 124 },
        { scale: 7.82, z: 36, shrink: 0.96, count: 104 },
        { scale: 7.2, z: 58, shrink: 0.88, count: 92 },
      ];
      const colors = ["#fff8f8", "#ffd0e5", "#ff9ac9", "#ff5aa5", "#ff2d86"];

      layers.forEach((layer, layerIndex) => {
        for (let i = 0; i < layer.count; i += 1) {
          const t = (i / layer.count) * Math.PI * 2;
          const wobble = Math.sin(i * 12.989 + layerIndex * 5.37) * 0.08;
          const x = 16 * Math.pow(Math.sin(t + wobble), 3);
          const y = -(
            13 * Math.cos(t) -
            5 * Math.cos(2 * t) -
            2 * Math.cos(3 * t) -
            Math.cos(4 * t)
          );
          const fill = randomBetween(0.78, 1.02);
          const centerPull = randomBetween(0.88, 1);
          const px = x * layer.scale * layer.shrink * fill * centerPull + randomBetween(-1.8, 1.8);
          const py = y * layer.scale * layer.shrink * fill + randomBetween(-1.8, 1.8);
          const pz = layer.z + randomBetween(-7, 7);
          const size = randomBetween(2.4, 4.2);
          const star = document.createElement("span");

          star.className = "star-point heart-star";
          star.style.setProperty("--size", `${size}px`);
          star.style.setProperty("--color", colors[(i + layerIndex) % colors.length]);
          star.style.setProperty("--duration", `${randomBetween(2.2, 4.8)}s`);
          star.style.transform = `translate3d(${px}px, ${py}px, ${pz}px)`;

          galaxy.appendChild(star);
        }
      });

      for (let i = 0; i < 95; i += 1) {
        const angle = randomBetween(0, Math.PI * 2);
        const radius = Math.sqrt(Math.random());
        const x = Math.cos(angle) * radius * randomBetween(16, 48);
        const y = Math.sin(angle) * radius * randomBetween(12, 42) + randomBetween(8, 38);
        const z = randomBetween(-42, 42);
        const star = document.createElement("span");

        star.className = "star-point heart-star";
        star.style.setProperty("--size", `${randomBetween(2.1, 3.7)}px`);
        star.style.setProperty("--color", colors[i % colors.length]);
        star.style.setProperty("--duration", `${randomBetween(2.4, 5)}s`);
        star.style.transform = `translate3d(${x}px, ${y}px, ${z}px)`;

        galaxy.appendChild(star);
      }
    }

    function createWordStars() {
      const total = 38;

      for (let i = 0; i < total; i += 1) {
        const phrase = phrases[i % phrases.length];
        const theta = randomBetween(0, Math.PI * 2);
        const phi = Math.acos(randomBetween(-1, 1));
        const radius = randomBetween(285, 455);
        const x = radius * Math.sin(phi) * Math.cos(theta);
        const y = radius * Math.sin(phi) * Math.sin(theta);
        const z = radius * Math.cos(phi);
        const word = document.createElement("span");

        word.className = "word-star";
        word.textContent = phrase;
        word.style.setProperty("--duration", `${randomBetween(2.4, 5.6)}s`);
        word.style.transform = `translate3d(${x}px, ${y}px, ${z}px)`;

        galaxy.appendChild(word);
      }
    }

    function createBackgroundDust() {
      const total = 68;

      for (let i = 0; i < total; i += 1) {
        const x = randomBetween(-460, 460);
        const y = randomBetween(-460, 460);
        const z = randomBetween(-360, 360);
        const size = randomBetween(1.2, 3.2);
        const dust = document.createElement("span");

        dust.className = "star-point";
        dust.style.setProperty("--size", `${size}px`);
        dust.style.setProperty("--color", Math.random() > 0.72 ? "#9be7ff" : "#ffffff");
        dust.style.setProperty("--duration", `${randomBetween(3, 7)}s`);
        dust.style.transform = `translate3d(${x}px, ${y}px, ${z}px)`;

        galaxy.appendChild(dust);
      }
    }

    function updateTogetherCounter() {
      const elapsed = Math.max(0, Date.now() - togetherStart.getTime());
      const totalSeconds = Math.floor(elapsed / 1000);
      const days = Math.floor(totalSeconds / 86400);
      const minutes = Math.floor((totalSeconds % 86400) / 60);
      const seconds = totalSeconds % 60;

      daysValue.textContent = days;
      minutesValue.textContent = minutes;
      secondsValue.textContent = seconds.toString().padStart(2, "0");
    }

    function updateRotation() {
      rotationX += (targetX - rotationX) * 0.09;
      rotationY += (targetY - rotationY) * 0.09;
      galaxy.style.transform = `rotateX(${rotationX}deg) rotateY(${rotationY}deg)`;

      requestAnimationFrame(updateRotation);
    }

    function handlePointerDown(event) {
      isDragging = true;
      lastPointerX = event.clientX;
      lastPointerY = event.clientY;

      if (universe.setPointerCapture && event.pointerId !== undefined) {
        universe.setPointerCapture(event.pointerId);
      }
    }

    function handlePointerMove(event) {
      if (!isDragging) {
        return;
      }

      const deltaX = event.clientX - lastPointerX;
      const deltaY = event.clientY - lastPointerY;

      targetY += deltaX * 0.42;
      targetX -= deltaY * 0.42;
      targetX = Math.max(-85, Math.min(85, targetX));

      lastPointerX = event.clientX;
      lastPointerY = event.clientY;
    }

    function handlePointerUp(event) {
      isDragging = false;

      if (
        universe.hasPointerCapture &&
        event.pointerId !== undefined &&
        universe.hasPointerCapture(event.pointerId)
      ) {
        universe.releasePointerCapture(event.pointerId);
      }
    }

    function handleTouchStart(event) {
      const touch = event.touches[0];

      if (!touch) {
        return;
      }

      isDragging = true;
      lastPointerX = touch.clientX;
      lastPointerY = touch.clientY;
    }

    function handleTouchMove(event) {
      if (!isDragging) {
        return;
      }

      const touch = event.touches[0];

      if (!touch) {
        return;
      }

      event.preventDefault();

      const deltaX = touch.clientX - lastPointerX;
      const deltaY = touch.clientY - lastPointerY;

      targetY += deltaX * 0.42;
      targetX -= deltaY * 0.42;
      targetX = Math.max(-85, Math.min(85, targetX));

      lastPointerX = touch.clientX;
      lastPointerY = touch.clientY;
    }

    function handleTouchEnd() {
      isDragging = false;
    }

    function initialize() {
      updateTogetherCounter();
      window.setInterval(updateTogetherCounter, 1000);

      try {
        createRandomStarfield();
        createBackgroundDust();
        createHeartStars();
        fallbackHeart.className += " hidden-fallback";
        createWordStars();
        updateRotation();
      } catch (error) {
        console.log(error);
      }

      if (window.PointerEvent) {
        universe.addEventListener("pointerdown", handlePointerDown);
        universe.addEventListener("pointermove", handlePointerMove);
        universe.addEventListener("pointerup", handlePointerUp);
        universe.addEventListener("pointercancel", handlePointerUp);
      }

      universe.addEventListener("touchstart", handleTouchStart, { passive: false });
      universe.addEventListener("touchmove", handleTouchMove, { passive: false });
      universe.addEventListener("touchend", handleTouchEnd);
      universe.addEventListener("touchcancel", handleTouchEnd);
    }

    initialize();
  </script>
</body>
</html>
